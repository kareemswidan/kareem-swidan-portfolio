<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="canonical" href="https://kareemswidan.github.io/">
  <title>Kareem Swidan — Portfolio moved</title>
  <script>
    (() => {
      const oldBase = "/kareem-swidan-portfolio";
      const rest = location.pathname.startsWith(oldBase) ? location.pathname.slice(oldBase.length) : "/";
      location.replace(`https://kareemswidan.github.io${rest || "/"}${location.search}${location.hash}`);
    })();
  </script>
</head>
<body>
  <p>Redirecting to Kareem Swidan's portfolio…</p>
</body>
</html>
